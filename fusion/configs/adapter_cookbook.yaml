# One ready-to-paste `models:` entry per output shape. Pick the one that matches
# your model, or run `cortext-fusion describe <your file> --markers <marker log>`.
# Every entry also accepts:
#   lower_is_better: true   # distances / losses (higher = LESS likely)
#   field: scores           # take this key from each trial's record first
#   weight: 1.0
#   file_pattern: "trial_(\\w+)"   # regex for trial ids in per-trial file names

models:
  # (a) one score per option ------------------------------------------------
  # JSON {trial_id: [sA, sB, sC, sD]}  or  {trial_id: {A: sA, B: sB, ...}}
  # or CSV long: trial_id, option_id, score   or  wide: trial_id, A, B, C, D
  - name: p300_per_option
    source: outputs/p300_per_option.json
    adapter: per_option
    options:
      key_by: auto            # auto | option | category (dict keys are option ids or category names)
      # key_prefix: "score_"  # wide CSV columns score_A, score_B, ...

  # P300 starter notebook (`find_p300_peak`): peak amplitude of each option's averaged ERP
  # Save e.g. {trial_id: {A: amp_A, B: amp_B, ...}} -> per_option. Larger P300 = attended.
  - name: p300_peak
    source: outputs/p300_peak_amplitude.json
    adapter: per_option

  # (b) one score per flash -------------------------------------------------
  # CSV long: trial_id, option_id, [repeat_index], score   (one row per flash)
  # .npy [trials, repeats, options]  (grid; columns in the stimulus log's option order)
  # .npy [trials, flashes]           (aligned with the marker log's flash order)
  - name: p300_per_flash
    source: outputs/p300_per_flash.csv
    adapter: per_flash
    options:
      aggregate: mean          # mean | sum | median
      # grid_order: [A, B, C, D]  # if grid columns are not in the stimulus log order

  # (c) one probability per option ------------------------------------------
  # JSON records {trial_id, option_ids: [...], probs: [...]}; zeros/ones are clipped
  - name: p300_probs
    source: outputs/p300_probs.json
    adapter: probabilities
    options:
      transform: log           # log for a softmax over options; logit for independent P(target)
      eps: 0.0001

  # (d) P(target) per flash epoch -------------------------------------------
  # CSV long: trial_id, option_id, repeat_index, p_target
  # .npy [trials, flashes, 2] = sklearn predict_proba (non-target, target)
  - name: p300_epoch_prob
    source: outputs/p300_epoch_prob.csv
    adapter: epoch_target_prob
    options:
      target_column: 1         # which column of predict_proba is "target"

  # (e) probabilities over many categories ----------------------------------
  # wide CSV: trial_id, p_dog, p_cat, ...  or .npy [trials, classes] + class names
  - name: category_probs
    source: outputs/category_probs.npy
    adapter: class_probabilities
    weight: 0.0
    options:
      class_names_file: outputs/class_names.txt   # or class_names: [dog, cat, ...]
      transform: log           # log | logit | none
      missing: error           # error | floor (option category not in the model's classes)
      check_target: true
      # category_map: {kitten: cat}

  # (f) one embedding per trial ---------------------------------------------
  # .npy [trials, dim]; option vectors from a {category: vector} JSON
  - name: category_embedding
    source: outputs/category_embedding.npy
    adapter: embedding
    weight: 0.0
    options:
      embeddings: outputs/option_embeddings.json
      key_by: category         # category | option
      metric: cosine           # cosine | dot | neg_euclidean

  # (g) lower is better -----------------------------------------------------
  # `distance` = per_option with lower_is_better: true
  - name: template_distance
    source: outputs/distances.json
    adapter: distance

  # don't know yet? auto-detects on the first trial and locks in (see the log line it prints)
  - name: unknown_model
    source: outputs/whatever.json
    adapter: auto
