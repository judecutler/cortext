# CorText fusion layer: annotated example config.
# Relative paths are resolved against THIS file's folder.
# Copy this file, change `source:` and `adapter:` for your model, run
#   cortext-fusion evaluate configs/my_config.yaml

stimulus_log:
  # CorText Lab exports: a session folder (session.json, trials.csv, markers.csv), an "Export all"
  # folder of session folders, or the downloaded .zip. Globs are fine. Trials are keyed "<session_id>:<trial_id>".
  lab_export: ../data/lab_exports/*
  # Any other stimulus log instead:  markers: path.csv   trials: path.csv   key_mode: auto|session|trial

models:
  # ---- P300 detector: one decision score per flash epoch -------------------
  - name: p300
    role: p300
    source: ../outputs/p300_scores.csv   # a file, or a folder of <trial_id>.json/.npy/.csv files
    adapter: per_flash                   # see configs/adapter_cookbook.yaml for every adapter
    options:
      aggregate: mean                    # mean | sum | median over each option's flashes
    lower_is_better: false               # true for distances / losses
    weight: 1.0                          # P300 carries the decision by default
    # normalize: zscore                  # per-model override of fusion.normalize

  # ---- Category / imagery model: probabilities over categories ------------
  - name: category
    role: category
    source: ../outputs/category_probs.csv
    adapter: class_probabilities
    options:
      key_prefix: "p_"                   # CSV columns p_dog, p_cat, ... -> classes dog, cat, ...
      # class_names: [dog, cat, ...]     # needed instead if the output is a bare array
      # category_map: {puppy: dog}       # stimulus category -> model class, if names differ
      check_target: true                 # flag when the top class is just the prompt's category
    weight: 0.0                          # stays OFF until calibration shows it adds value on held-out data

fusion:
  normalize: zscore                      # zscore | logsoftmax | softmax | center | none (per trial, across options)
  unsure_threshold: 0.4                  # confidence below this -> "unsure" (chance is 0.25 with 4 options)
  temperature: 1.0                       # only used without a calibration file
  calibration_file: calibration.yaml     # written by `cortext-fusion calibrate`; overrides the weights above if present
  min_gain_logloss: 0.01                 # a 0-weight model is switched on only if held-out log-loss improves this much

sequential:                              # live early stopping (server /sequential/* and the evaluation's simulation)
  stop_confidence: 0.9
  min_repeats: 3
  max_repeats: null
  input: prob                            # live per-flash values: prob = P(target) per epoch | score = raw decision value
  scale: 1.0                             # evidence per unit (fit with SequentialFuser.fit_scale on validation data)
  final_wait_s: 1.0                      # after trial_end, wait for late scores (the app gives up after 3 s)

evaluation:
  holdout: session                       # session | participant  (never random trials)
  n_shuffles: 200                        # shuffled-label control
  n_noise: 50                            # noise-score control (whole pipeline re-run on noise)
  output_dir: report
  seed: 0
